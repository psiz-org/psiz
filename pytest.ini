[pytest]
addopts = --strict-markers
filterwarnings =
    ignore:.*Dataset\.export\(export_format='tfds'\).*:DeprecationWarning
    ignore:.*`[^`]+\.export\(export_format='tfds'\)` is deprecated and will be removed in a future release\. Use `[^`]+\.numpy\(\.\.\.\)` instead\.:DeprecationWarning
    ignore:__array__ implementation doesn't accept a copy keyword.*:DeprecationWarning:keras\.src\.backend\.(tensorflow\.core|torch\.core|common\.variables)
    ignore:__array__ implementation doesn't accept a copy keyword.*:DeprecationWarning:torch\.utils\._pytree
    ignore:`torch\.jit\.script_method` is deprecated.*:DeprecationWarning:torch\.jit\._script
    ignore:distutils Version classes are deprecated\. Use packaging\.version instead\.:DeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    adapter_surface: marks fast adapter-contract tests independent of native backend runtime jobs
    backend_runtime: marks tests that must run under an explicitly selected native backend
    backend_tensorflow: marks tests intended for TensorFlow runtime job
    backend_torch: marks tests intended for PyTorch runtime job
    backend_jax: marks tests intended for JAX runtime job
    backend_slow: marks reduced slow-suite backend tests
    docs_example: marks smoke tests that validate docs/example workflows
