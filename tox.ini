[tox]
minversion = 4.20
envlist =
    py{310,311,312,313}-{tensorflow,torch,jax}
    py311-{tensorflow,torch,jax}-slow

[testenv]
description = Run PsiZ tests for a specific backend/runtime target.
package = wheel
install_command = python -m pip install {opts} {packages}
extras =
    test
    backend-{env:PSIZ_BACKEND}
setenv =
    PYTHONHASHSEED = 0
    PSIZ_EXPECTED_BACKEND = {env:KERAS_BACKEND:}
    tensorflow: KERAS_BACKEND = tensorflow
    tensorflow: PSIZ_BACKEND = tensorflow
    torch: KERAS_BACKEND = torch
    torch: PSIZ_BACKEND = torch
    jax: KERAS_BACKEND = jax
    jax: PSIZ_BACKEND = jax
torch: install_command = python -m pip install --extra-index-url {env:PSIZ_TORCH_EXTRA_INDEX_URL:https://pypi.ngc.nvidia.com} {opts} {packages}
passenv =
    KERAS_BACKEND
    PSIZ_EXPECTED_BACKEND
commands_pre =
    python -c "import os, keras; expected=os.environ.get('KERAS_BACKEND'); actual=keras.backend.backend(); print(f'expected_backend={expected} active_backend={actual}'); assert actual == expected"
commands =
    python -m pytest -m "not slow and not backend_slow" {posargs}
    slow: python -m pytest -m "backend_slow" {posargs}